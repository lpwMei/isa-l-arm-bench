name: EC SVE independent validation
on:
  workflow_dispatch:
  push:
    branches: [codex/ec-sve-opt]
    paths: [.github/workflows/ec-sve-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      UPSTREAM_SHA: 8fa1e72fee7338fcfbf829b00f2f407631bd2dba
      VARIANT: adaptive
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev python3
      - name: Correctness, seven paired target rounds and broader performance checks
        run: bash experiments/ec-sve/run_validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ec-sve-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/ec-sve-validation/results
          retention-days: 14

